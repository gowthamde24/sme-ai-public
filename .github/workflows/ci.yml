name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides whether the slow `db` job (about 23 minutes) can affect this change. It checks nothing itself. A push to main always runs `db`. A pull request skips `db` ONLY when every
  # changed file is under docs/, apps/web/ or e2e/, or is a *.md file, and none is under the paths that always run it. A path that is on neither list also runs `db` (fail closed).
  # One document is on the always-run list although it is under docs/: tests/integration/test_demo_seed.py runs the SQL blocks of docs/runbooks/agents-kill-switch.md against the real schema.
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.decide.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "db job: RUNS (a push to main runs every job)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          needed=false
          reason=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              supabase/*|services/ai-api/*|tests/integration/*|packages/*|deploy/*|tools/*|.github/*|docs/runbooks/agents-kill-switch.md)
                needed=true; reason="$f is on the always-run list"; break ;;
              docs/*|apps/web/*|e2e/*|*.md) ;;
              *)
                needed=true; reason="$f is on neither list (fail closed)"; break ;;
            esac
          done <<< "$files"
          echo "db=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = true ]; then
            echo "db job: RUNS ($reason)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "db job: SKIPPED on purpose (only docs/**, apps/web/**, e2e/** or *.md changed; the db job cannot be affected)" >> "$GITHUB_STEP_SUMMARY"
          fi

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test-packages

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-leftovers.sh
      - run: python3 scripts/test-lanes.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsc --noEmit -p ../../packages/contracts/tsconfig.json
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  db:
    needs: changes
    # Runs unless `changes` said no. If `changes` itself fails, `db` still runs (nothing is skipped by accident).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.db == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase start
      - run: supabase test db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e "services/ai-api[dev]"
      - name: Integration tests (API + local Supabase)
        working-directory: services/ai-api
        run: ../../scripts/with-local-supabase-env.sh pytest -c pyproject.toml ../../tests/integration -q
