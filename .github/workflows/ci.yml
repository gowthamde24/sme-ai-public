name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue (owner, 5 Nov 2026: instead of "require branches to be up to date"): every required check also runs on the queue's merge commit, so main only ever gets a commit that passed them
  merge_group:

permissions:
  contents: read

# a new push to a pull request cancels its run that is still going (CI speed, owner 6 Nov 2026); runs on main and in the merge queue are never cancelled
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The integration tests are split BY FILE into four groups that run in parallel, each on its own runner with its own Supabase stack. Groups 1, 2 and 4 are explicit lists;
# group 3 is "everything else in tests/integration", so a NEW test file lands in group 3 automatically and no file can be left out. A file listed here that no longer
# exists makes pytest fail ("file or directory not found"), so a stale list is loud. No group may run longer than 12 minutes: group 4 (29 Oct) took the assistant and voice files out of group 3 (then 15-24 minutes);
# its first run left group 3 at 14-16 minutes, so five of its biggest files moved too (group 3 about 11, group 4 about 9). Every group prints its ten slowest tests (--durations=10) so the next split is decided from numbers.
env:
  # CI has ONE local stack per runner (a plain `supabase start`), the repository's own supabase/ project: it is the "owner" stack in the sense of docs/runbooks/two-local-stacks.md, and it is
  # throwaway, so the destructive-action guard is released here. (On a person's machine the default is the separate AGENT stack; see that runbook.)
  SME_STACK: owner
  OWNER_OK: "1"
  INTEGRATION_GROUP_1: >-
    test_demo_seed.py test_erasure_direct_postgrest.py test_evidence_direct_postgrest.py test_followup_due_spike.py test_followup_races.py test_followup_whatsapp.py
    test_mfa_enforcement.py test_order_api.py test_order_equivalence.py test_order_erasure.py test_price_list_import_api.py test_quote_api.py
    test_quote_engine_equivalence.py test_quote_policy_api.py test_quote_text_joiners_api.py test_requirement_e2e.py test_requirement_evals.py
    test_requirement_rerun_direct_postgrest.py test_t005_direct_postgrest.py
  INTEGRATION_GROUP_2: >-
    test_agent_direct_postgrest.py test_agent_runs_api.py test_api_end_to_end.py test_claim_home.py test_daily_cost_cap.py test_direct_postgrest.py test_eval_harness.py
    test_icp_template_in_db.py test_item_types_api.py test_last_owner_race.py test_live_server_logs.py test_quote_direct_postgrest.py test_quote_races.py
    test_real_data_gate_direct_postgrest.py test_requirement_concurrency.py test_requirement_golden.py test_research_e2e.py test_research_evals.py test_research_golden.py

  INTEGRATION_GROUP_4: >-
    test_assistant_actions.py test_assistant_api.py test_assistant_evals.py test_assistant_smoke.py test_assistant_tokens.py test_model_bakeoff.py test_ea_turns_api.py
    test_eb_context_api.py test_voice_api.py test_cv_voice_reports.py test_dj_voice_notes_db.py
    test_bq_bakeoff.py test_evidence_api.py test_followup_api.py test_visits_api.py test_suppression_api.py

jobs:
  # Decides whether the db jobs (`db-pgtap`, `db-integration-1..4`, then the one required `db` that sums them up) can affect this change. It checks nothing itself. A push to main always runs `db`. A pull request skips `db` ONLY when every
  # changed file is under docs/, apps/web/ or e2e/, or is a *.md file, and none is under the paths that always run it. A path that is on neither list also runs `db` (fail closed).
  # One document is on the always-run list although it is under docs/: tests/integration/test_demo_seed.py runs the SQL blocks of docs/runbooks/agents-kill-switch.md against the real schema.
  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.decide.outputs.unit }}
      integration: ${{ steps.decide.outputs.integration }}
      pgtap: ${{ steps.decide.outputs.pgtap }}
      web: ${{ steps.decide.outputs.web }}
      webtests: ${{ steps.decide.outputs.webtests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          # a pull request compares its base with its head; a merge-queue run compares main with the queue's merge commit (the same rule for both)
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; then
            echo "unit=true" >> "$GITHUB_OUTPUT"
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "pgtap=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "webtests=true" >> "$GITHUB_OUTPUT"
            echo "db job: RUNS (a push to main or any other event runs every job)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          # the visual job: the pictures can change only with the web app, the visual tests or the workflows that run them
          web=false
          while IFS= read -r f; do
            case "$f" in
              apps/web/*|e2e/visual/*|.github/workflows/ci.yml|.github/workflows/visual.yml) web=true; break ;;
            esac
          done <<< "$files"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          # the web's own tests (the fast lane, owner 6 Nov 2026): skipped ONLY when every changed file is under docs/, services/ai-api/, supabase/ or tests/, or is a *.md file (none of
          # which the web is built from); anything else, including a path on no list, runs them (fail closed)
          webtests=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|services/ai-api/*|supabase/*|tests/*|*.md) ;;
              *) webtests=true; break ;;
            esac
          done <<< "$files"
          echo "webtests=$webtests" >> "$GITHUB_OUTPUT"
          echo "web tests: $([ "$webtests" = true ] && echo RUNS || echo 'SKIPPED on purpose (only docs, the API, the database or *.md changed)')" >> "$GITHUB_STEP_SUMMARY"
          echo "visual job: $([ "$web" = true ] && echo RUNS || echo 'SKIPPED on purpose (nothing under apps/web/, e2e/visual/ or the visual workflows changed)')" >> "$GITHUB_STEP_SUMMARY"
          # THE TEST LANES (owner 12 Nov 2026: only what a change can affect; every lane runs on main and in the merge queue). `unit` = the API unit tests, `integration` = the integration tests against a
          # real local Supabase, `pgtap` = the database's own tests. Fail closed: a path on no list, or a change to the CI itself, runs everything. Docs run the unit lane (some unit tests read docs/ and
          # deploy/), never the database lanes; only supabase/ runs pgTAP.
          unit=false; integration=false; pgtap=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/*|scripts/ci/*|services/ai-api/pyproject.toml) unit=true; integration=true; pgtap=true ;;
              supabase/*) unit=true; integration=true; pgtap=true ;;
              services/ai-api/*|packages/*) unit=true; integration=true ;;
              docs/runbooks/agents-kill-switch.md) unit=true; integration=true ;;
              tests/integration/*|scripts/with-local-supabase-env.sh|scripts/sb) integration=true ;;
              deploy/*|tools/*|tests/*|docs/*|scripts/*) unit=true ;;
              apps/web/*|e2e/*|*.md) ;;
              *) unit=true; integration=true; pgtap=true ;;
            esac
          done <<< "$files"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "pgtap=$pgtap" >> "$GITHUB_OUTPUT"
          echo "lanes: unit=$unit integration=$integration pgtap=$pgtap (a lane that is false is skipped on purpose; it always runs on main and in the merge queue)" >> "$GITHUB_STEP_SUMMARY"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test-packages

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-leftovers.sh
      - run: python3 scripts/test-lanes.py

  # The web check is three jobs: web-static (lint, types, build, the route budget) and web-tests (two parts of the vitest suite, in parallel); THE required check `web` sums them up.
  web-static:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.webtests != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint and Next.js caches (only speed; a stale cache is checked again from scratch)
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.eslintcache
            apps/web/.next/cache
          key: web-cache-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ github.sha }}
          restore-keys: web-cache-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npx eslint . --cache --cache-location .eslintcache
      - run: npm run typecheck
      - run: npx tsc --noEmit -p ../../packages/contracts/tsconfig.json
      - run: npm run build
      # job CF: the gzip JavaScript of every page route against scripts/budget.json (reads the build, no server: about a second)
      - run: npm run audit:route-js

  web-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.webtests != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    name: web-tests (${{ matrix.part }})
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.part }}/2

  web:
    needs: [changes, web-static, web-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Sum up the web jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          skip=$(echo "$NEEDS" | jq -r 'if .changes.result == "success" and .changes.outputs.webtests == "false" then "yes" else "no" end')
          allowed='^success$'; [ "$skip" = yes ] && allowed='^(skipped|success)$'
          for j in web-static web-tests; do
            r=$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')
            printf '%s\n' "$r" | grep -Eq "$allowed" || { echo "FAIL: $j is $r"; exit 1; }
          done
          echo "web: OK"

  # The API check is three jobs: api-static (ruff, mypy with its cache) and api-tests (three parts of the unit suite, balanced by time by scripts/ci/shard_tests.py, each on 4 CPUs with
  # pytest-xdist; the few real-time tests marked `serial` run alone afterwards); THE required check `api` sums them up. A PR that changes only docs/, apps/web/, e2e/ or *.md skips the tests.
  api-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: mypy cache (only speed)
        uses: actions/cache@v4
        with:
          path: services/ai-api/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('services/ai-api/pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('services/ai-api/pyproject.toml') }}-
      - run: ruff check .
      - run: mypy

  api-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    name: api-tests (${{ matrix.part }})
    defaults:
      run:
        working-directory: services/ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      # the packages' .deb files are kept between runs (6 Nov 2026: Ubuntu's mirror stalled and this step took 37 minutes instead of 17 seconds); a cache miss downloads them once, with retries
      - name: Cached .deb files for ffmpeg, poppler and Tesseract
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-poppler-tesseract-${{ runner.os }}-v1
      - name: ffmpeg, poppler and Tesseract (the voice-note converter and the chat file reader run the real programs; REQUIRE_FFMPEG makes a missing ffmpeg a failure)
        # apt's own timeout does not catch a mirror that trickles (this step sat 28 minutes on #399's first run): each attempt has a hard limit, three attempts, and the step stops at 12 minutes
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p ~/apt-archives/partial
          APT="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          ok=0
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
               && sudo timeout 150 apt-get install -y --no-install-recommends $APT ffmpeg poppler-utils tesseract-ocr tesseract-ocr-eng; then
              ok=1; break
            fi
            echo "apt attempt $attempt did not finish in time; trying again"
          done
          [ "$ok" = 1 ]
          sudo chown -R "$USER" ~/apt-archives
      - run: pip install -e ".[dev]"
      - name: Unit tests, part ${{ matrix.part }} of 3
        run: |
          set -euo pipefail
          mapfile -t files < <(python3 ../../scripts/ci/shard_tests.py 3 ${{ matrix.part }})
          echo "${#files[@]} test files in this part"
          pytest -q -n 4 -m "not serial" --junitxml=junit-unit-${{ matrix.part }}.xml -o junit_family=xunit2 "${files[@]}"
          set +e
          pytest -q -p no:xdist -m serial "${files[@]}"
          rc=$?
          set -e
          [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]   # 5: no real-time test in this part
      - name: Keep the timing report (it balances the parts, see scripts/ci/refresh_durations.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.part }}
          path: services/ai-api/junit-unit-${{ matrix.part }}.xml
          if-no-files-found: ignore
          retention-days: 14

  api:
    needs: [changes, api-static, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Sum up the API jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$NEEDS" | jq -r '."api-static".result')" = success ] || { echo "FAIL: api-static"; exit 1; }
          skip=$(echo "$NEEDS" | jq -r 'if .changes.result == "success" and .changes.outputs.unit == "false" then "yes" else "no" end')
          r=$(echo "$NEEDS" | jq -r '."api-tests".result')
          if [ "$skip" = yes ]; then printf '%s\n' "$r" | grep -Eq '^(skipped|success)$' || { echo "FAIL: api-tests is $r"; exit 1; }
          else [ "$r" = success ] || { echo "FAIL: api-tests is $r"; exit 1; }; fi
          echo "api: OK"

  # The db work is four parallel jobs (pgTAP, and three groups of integration tests). Each runs when `changes` says so, with the same condition the single `db` job used:
  # it runs unless `changes` succeeded and said no. If `changes` itself fails, the groups still run (nothing is skipped by accident).
  db-pgtap:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.pgtap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: supabase start (retried, the image registry rate-limits and a container sometimes fails to bind)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - run: supabase test db

  db-integration-1:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: supabase start (retried, the image registry rate-limits and a container sometimes fails to bind)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e "services/ai-api[dev]"
      - name: Integration tests, group 1 (API + local Supabase)
        working-directory: services/ai-api
        run: |
          set -euo pipefail
          files=()
          for f in $INTEGRATION_GROUP_1; do files+=("../../tests/integration/$f"); done
          ../../scripts/with-local-supabase-env.sh pytest -c pyproject.toml "${files[@]}" -q --durations=10 --junitxml=../../junit-int-1.xml -o junit_family=xunit2
      - name: Keep the timing report (it balances the shards, see scripts/ci/refresh_durations.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-int-1
          path: junit-int-1.xml
          if-no-files-found: ignore
          retention-days: 14

  db-integration-2:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: supabase start (retried, the image registry rate-limits and a container sometimes fails to bind)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e "services/ai-api[dev]"
      - name: Integration tests, group 2 (API + local Supabase)
        working-directory: services/ai-api
        run: |
          set -euo pipefail
          files=()
          for f in $INTEGRATION_GROUP_2; do files+=("../../tests/integration/$f"); done
          ../../scripts/with-local-supabase-env.sh pytest -c pyproject.toml "${files[@]}" -q --durations=10 --junitxml=../../junit-int-2.xml -o junit_family=xunit2
      - name: Keep the timing report (it balances the shards, see scripts/ci/refresh_durations.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-int-2
          path: junit-int-2.xml
          if-no-files-found: ignore
          retention-days: 14

  db-integration-3:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: supabase start (retried, the image registry rate-limits and a container sometimes fails to bind)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e "services/ai-api[dev]"
      - name: Integration tests, group 3 (everything not in group 1, 2 or 4)
        working-directory: services/ai-api
        run: |
          set -euo pipefail
          ignores=()
          for f in $INTEGRATION_GROUP_1 $INTEGRATION_GROUP_2 $INTEGRATION_GROUP_4; do ignores+=("--ignore=../../tests/integration/$f"); done
          ../../scripts/with-local-supabase-env.sh pytest -c pyproject.toml ../../tests/integration "${ignores[@]}" -q --durations=10 --junitxml=../../junit-int-3.xml -o junit_family=xunit2
      - name: Keep the timing report (it balances the shards, see scripts/ci/refresh_durations.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-int-3
          path: junit-int-3.xml
          if-no-files-found: ignore
          retention-days: 14

  db-integration-4:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: supabase start (retried, the image registry rate-limits and a container sometimes fails to bind)
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-api/pyproject.toml
      - run: pip install -e "services/ai-api[dev]"
      - name: Integration tests, group 4 (the assistant and voice files)
        working-directory: services/ai-api
        run: |
          set -euo pipefail
          files=()
          for f in $INTEGRATION_GROUP_4; do files+=("../../tests/integration/$f"); done
          ../../scripts/with-local-supabase-env.sh pytest -c pyproject.toml "${files[@]}" -q --durations=10 --junitxml=../../junit-int-4.xml -o junit_family=xunit2
      - name: Keep the timing report (it balances the shards, see scripts/ci/refresh_durations.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-int-4
          path: junit-int-4.xml
          if-no-files-found: ignore
          retention-days: 14

  # THE required check `visual`. It used to live in visual.yml with a path filter, so a pull request that touched no web file never got a `visual` check at all and stayed BLOCKED. Now it is a job of this
  # workflow: it ALWAYS runs (`if: always()`) and reports, and does the real work only when `changes` says the web or the visual tests changed. A pull request that changed nothing there gets a green
  # `visual` that says it skipped on purpose. Fail closed: if `changes` itself failed or said anything but "false", the pictures are compared. (visual.yml stays, by hand only, to write the Linux baselines.)
  visual:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_VISUAL: ${{ needs.changes.result != 'success' || needs.changes.outputs.web != 'false' }}
    steps:
      - name: Decide
        run: |
          if [ "$RUN_VISUAL" = true ]; then
            echo "visual: RUNS (changes: $CHANGES_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "visual: SKIPPED on purpose (nothing under apps/web/, e2e/visual/ or the visual workflows changed)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: ${{ env.RUN_VISUAL == 'true' }}
      - name: Are there Linux baselines?
        id: baselines
        if: ${{ env.RUN_VISUAL == 'true' }}
        run: |
          if ls e2e/visual/baselines/linux/*.jpg >/dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; echo "No Linux baselines are committed yet: the visual comparison is skipped. Run the Visual workflow by hand with update ticked to make them." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v4
        if: ${{ env.RUN_VISUAL == 'true' && steps.baselines.outputs.have == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        if: ${{ env.RUN_VISUAL == 'true' && steps.baselines.outputs.have == 'true' }}
        working-directory: apps/web
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Compare with the baselines
        if: ${{ env.RUN_VISUAL == 'true' && steps.baselines.outputs.have == 'true' }}
        run: node e2e/visual/run.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: visual-changed-pictures
          path: e2e/visual/out
          if-no-files-found: ignore

  # THE required check. It is the only job named `db`. It always runs (`if: always()`, so a failed, cancelled or skipped group can never leave it "skipped", which would count as passing) and
  # decides from the results of the four groups:
  #   - `changes` succeeded and said no db work: the groups are skipped, and that is a pass (a group that somehow ran must not have failed or been cancelled).
  #   - in every other case (`changes` said yes, failed, was cancelled or skipped): EVERY group must be `success`. `skipped`, `failure` and `cancelled` all fail.
  # The groups are read from the `needs` context itself, so a group added to `needs` is judged too. The count check below fails the job if a group is removed from `needs`.
  db:
    needs: [changes, db-pgtap, db-integration-1, db-integration-2, db-integration-3, db-integration-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Sum up the db groups
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_GROUPS: "5"
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          changes_result=$(echo "$NEEDS" | jq -r '.changes.result')
          keys=$(echo "$NEEDS" | jq -r 'keys[] | select(startswith("db-"))')
          count=$(printf '%s\n' "$keys" | grep -c . || true)
          if [ "$count" != "$EXPECTED_GROUPS" ]; then
            echo "FAIL: expected $EXPECTED_GROUPS db jobs in needs, found $count"; exit 1
          fi
          # each db job belongs to a lane (pgTAP, or the integration tests); a lane `changes` said false may be skipped, every other job must be success
          bad=0
          for k in $keys; do
            case "$k" in db-pgtap) lane=pgtap ;; *) lane=integration ;; esac
            result=$(echo "$NEEDS" | jq -r --arg k "$k" '.[$k].result')
            flag=$(echo "$NEEDS" | jq -r --arg l "$lane" '.changes.outputs[$l] // ""')
            if [ "$changes_result" = success ] && [ "$flag" = false ]; then allowed='^(skipped|success)$'; else allowed='^success$'; fi
            if ! printf '%s\n' "$result" | grep -Eq "$allowed"; then echo "FAIL: $k is $result (lane $lane = $flag)"; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "FAIL: at least one db job did not finish as required"; exit 1; }
          echo "db: OK"
