# Security scans (job DT, security audit): secrets in the code and its history (gitleaks), known-vulnerable dependencies (osv-scanner) and static analysis (CodeQL). They read the repository only; none
# needs a secret of ours. Not part of the required checks yet: make them required in the branch protection once they have run clean a few times.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: a new advisory can turn an old dependency red

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the working tree and the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner --exit-code 1

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the lock files and the Python dependencies
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source --recursive /src/apps/web /src/e2e /src/services/ai-api

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
