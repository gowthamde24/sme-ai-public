[project]
name = "ai-api"
version = "0.1.0"
description = "SME AI Revenue Engine backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "websockets>=15",   # the streaming conversation loop (job natural-voice): Sarvam realtime speech and voice sockets
    "pyjwt[crypto]>=2.9",
    # job AY (ADR 0069): resize catalogue photos, make thumbnails and strip EXIF/location data on the server
    # security audit (job DT): Pillow 12.3 has published CVEs fixed in 13.0.0; it decodes every upload
    "pillow>=13.0.0",
    # security audit (job DT): certifi before 2026.10.19 has a published advisory (PYSEC-2026-4320); httpx pulls it in
    "certifi>=2026.10.19",
    # job DP part 6: error reporting (Sentry). Imported and started ONLY when SENTRY_DSN is set; scrubbed before anything leaves (app/observability/sentry.py)
    "sentry-sdk>=2.30,<3",
]

[project.optional-dependencies]
# the audio turn model (Indic Smart Turn, app/conversation/audio_turn.py): installed in the API image only; the service runs without them (the text rules decide)
audio-turn = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
]
# the speaker check (app/conversation/speaker.py, browser Live talk only): Kaldi filterbank features for the CAM++ model (also needs the audio-turn extra's numpy and onnxruntime)
speaker = [
    "kaldi-native-fbank>=1.22,<2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
