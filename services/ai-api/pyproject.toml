# T009 integration: the quote path (long explanatory docstrings)
"app/quotes/*" = ["E501"]
"app/orders/*" = ["E501"]
# T010: the suppression path (long explanatory docstrings)
"app/suppression/*" = ["E501"]
# T010 part 2: the follow-up path (long explanatory docstrings, fixed sentences)
"app/followups/*" = ["E501"]
"tests/test_followups_*.py" = ["E501", "S311"]
"tests/followups_fakes.py" = ["E501"]
"tests/test_suppression_*.py" = ["E501", "S311"]
"tests/suppression_fakes.py" = ["E501"]
# job AG: the Main agent (its policy text, fixed sentences in five languages, long explanatory docstrings)
"app/assistant/*" = ["E501"]
"app/today/*" = ["E501"]
# job AT: the outbox (long explanatory docstrings, fixed sentences in plain words)
"app/outbox/*" = ["E501"]
"tests/test_outbox_*.py" = ["E501"]
"tests/outbox_fakes.py" = ["E501"]
"seeds/*" = ["E501"]
"tests/test_quote_seed_script.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "../../tests/integration", "../../tests/rehearsal", "../../scripts/seed_demo.py", "../../scripts/smoke_fetch.py"]
