"app/integrations/*" = ["E501"]
"app/crm/phone.py" = ["E501"]
"tests/test_integrations_*.py" = ["E501"]
# job BN: privacy rights (long explanatory docstrings, the one-line route and repository tables)
"app/privacy/*" = ["E501"]
"tests/test_privacy_*.py" = ["E501"]
"tests/privacy_fakes.py" = ["E501"]
# job BR: WhatsApp (long explanatory docstrings, one-line payload tables)
"app/whatsapp/*" = ["E501"]
"tests/test_whatsapp_*.py" = ["E501"]
"tests/whatsapp_fakes.py" = ["E501"]
"../../scripts/fake_whatsapp_server.py" = ["E501"]
# job BY: the team, the shop's basics and report, notifications and web-push (long explanatory docstrings, one-line tables)
"app/team/*" = ["E501"]
"app/workspace/*" = ["E501"]
"app/notifications/*" = ["E501"]
"app/rpc_base.py" = ["E501"]
"tests/test_by_*.py" = ["E501"]
"tests/by_fakes.py" = ["E501"]
"../../tests/integration/push_support.py" = ["E501"]
"../../tests/integration/test_by_web_apis.py" = ["E501"]
# job BP: web research tools (long explanatory docstrings, one-line tables)
"app/websearch/*" = ["E501"]
"app/assistant/web_tools.py" = ["E501"]
"tests/test_bp_*.py" = ["E501"]
"tests/bp_fakes.py" = ["E501"]
"tests/integrations_fakes.py" = ["E501"]
# job AS: store visits (fixed message templates in five languages, long explanatory docstrings)
"app/visits/*" = ["E501"]
# job AW: the scheduler (long explanatory docstrings)
"app/scheduler/*" = ["E501"]
# job AY: the catalogue (long explanatory docstrings)
"app/catalogue/*" = ["E501"]
