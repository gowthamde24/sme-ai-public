[project]
name = "ai-api"
version = "0.1.0"
description = "SME AI Revenue Engine backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    # job AY (ADR 0069): resize catalogue photos, make thumbnails and strip EXIF/location data on the server
    "pillow>=11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# job BZ: connectors read like their providers' documentation (long lines of fields and examples)
"app/connectors/*" = ["E501"]
"tests/test_bz_*.py" = ["E501"]
"../../tests/integration/test_bz_*.py" = ["E501"]
# job CA: the GSTIN module and the business profile read like their documentation (long lines)
"app/gstin.py" = ["E501"]
"app/businessprofile/*" = ["E501"]
"tests/test_ca_*.py" = ["E501"]
"tests/test_migration_copies_ca.py" = ["E501"]
"../../tests/integration/test_ca_*.py" = ["E501"]
# job CB: the hardening layer is documented in long lines
"app/hardening/*" = ["E501"]
# job CK: packs, custom fields and their tests read like the blueprint and the ADR they implement (long lines)
"app/packs/*" = ["E501"]
"app/customfields/*" = ["E501"]
"app/units.py" = ["E501"]
"tests/test_ck_*.py" = ["E501"]
"tests/test_migration_copies_ck.py" = ["E501"]
"../../tests/integration/test_ck_*.py" = ["E501"]
"../../scripts/packs_check.py" = ["E501"]
"../../scripts/pack_migration.py" = ["E501"]
"../../scripts/new_pack.py" = ["E501"]
# job CN: sites, dues, material quotes, deliveries and their tests read like the blueprint and the ADR they implement (long lines)
"app/sites/*" = ["E501"]
"app/dues/*" = ["E501"]
"app/materials/*" = ["E501"]
"app/deliveries/*" = ["E501"]
"tests/test_cn_*.py" = ["E501"]
"tests/test_migration_copies_cn.py" = ["E501"]
"../../tests/integration/test_cn_*.py" = ["E501"]
# job CP: campaigns, the shared ledger's new routes and their tests read like the ADR they implement (long lines)
"app/campaigns/*" = ["E501"]
"tests/test_cp_*.py" = ["E501"]
"tests/cp_fakes.py" = ["E501"]
"tests/test_migration_copies_cp.py" = ["E501"]
"../../tests/integration/test_cp_*.py" = ["E501"]
# job CR: the education pack and its tests read like the ADR they implement (long lines)
"app/education/*" = ["E501"]
"tests/test_cr_*.py" = ["E501"]
"tests/test_migration_copies_cr.py" = ["E501"]
"../../tests/integration/test_cr_*.py" = ["E501"]
# job CV: the one reports API, voice notes and their tests read like the ADR they implement (long lines)
"app/reports/*" = ["E501"]
"app/voice_notes/*" = ["E501"]
"app/outbox/voice_hook.py" = ["E501"]
"tests/test_cv_*.py" = ["E501"]
"tests/cv_fakes.py" = ["E501"]
"tests/test_migration_copies_cv.py" = ["E501"]
"../../tests/integration/test_cv_*.py" = ["E501"]
"tests/test_cb_*.py" = ["E501"]
"../../tests/integration/test_cb_*.py" = ["E501"]
# job CD: the error module, the WhatsApp tooling and their tests read like their documentation (long lines)
"app/errors.py" = ["E501"]
"tests/test_cd_*.py" = ["E501"]
"tests/test_whatsapp_samples.py" = ["E501"]
"../../scripts/whatsapp_test_local.py" = ["E501"]
"../../scripts/prepare_channel_agent.py" = ["E501"]
"../../scripts/loadtest.py" = ["E501"]
"../../scripts/restore_drill.py" = ["E501"]
"../../scripts/secret_scan.py" = ["E501"]
# job CE: the hosting tests and the smoke script read like the runbooks they check (long lines)
"tests/test_ce_*.py" = ["E501"]
"../../scripts/hosted_smoke.py" = ["E501"]
"../../tests/integration/*" = ["S101", "S105", "S106"]
"../../tests/rehearsal/*" = ["S101"]
# a script of readable data tables and a long explanatory header
"../../scripts/seed_demo.py" = ["E501"]
"../../scripts/seed_demo_manual.py" = ["E501"]
"../../scripts/seed_demo_outbox.py" = ["E501"]
"../../scripts/seed_demo_catalogue.py" = ["E501"]
"../../scripts/local_confirm.py" = ["E501"]
"../../scripts/demo_code.py" = ["E501"]
"../../scripts/dev_worker_local.py" = ["E501"]
"../../scripts/stack_env.py" = ["E501"]
"../../scripts/gen_agent_stack.py" = ["E501"]
"tests/test_local_demo_scripts.py" = ["E501"]
# T008: word lists, synonym tables and regular expressions that read better on one line, and long explanatory docstrings
"app/requirements/*" = ["E501"]
# the requirement agent: its policy text and a long explanatory docstring per file
"app/agents/requirement*.py" = ["E501"]
# T008: the enquiry API (long docstrings and fixed messages)
