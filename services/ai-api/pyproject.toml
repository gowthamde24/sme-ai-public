[project]
name = "ai-api"
version = "0.1.0"
description = "SME AI Revenue Engine backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"../../tests/integration/*" = ["S101", "S105", "S106"]
# a script of readable data tables and a long explanatory header
"../../scripts/seed_demo.py" = ["E501"]
# T008: word lists, synonym tables and regular expressions that read better on one line, and long explanatory docstrings
"app/requirements/*" = ["E501"]
# the requirement agent: its policy text and a long explanatory docstring per file
"app/agents/requirement*.py" = ["E501"]
# T008: the enquiry API (long docstrings and fixed messages)
"app/enquiries/*" = ["E501"]
"app/agents/llm/fake_requirement.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "../../tests/integration", "../../scripts/seed_demo.py", "../../scripts/smoke_fetch.py"]
