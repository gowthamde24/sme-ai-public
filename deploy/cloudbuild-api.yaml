# Remote image build for the API (and the worker, which is the same image), job DC. Used by deploy/staging.sh; build from the repository root:
#   gcloud builds submit --region asia-south1 --config deploy/cloudbuild-api.yaml --substitutions _IMAGE=<image> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.api", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
