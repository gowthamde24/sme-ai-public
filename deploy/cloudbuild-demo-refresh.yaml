# Remote image build for the staging job sme-demo-refresh (used by deploy/demo-refresh.sh), from the repository root:
#   gcloud builds submit --region asia-south1 --config deploy/cloudbuild-demo-refresh.yaml --substitutions _IMAGE=<image> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.demo-refresh", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
